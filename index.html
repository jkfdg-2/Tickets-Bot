<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5C57">
  <meta name="description" content="قراءة القرآن الكريم وحفظه وتسميعه بالمايك وختمه — يعمل مباشرة بلا تسجيل.">
  <title>رتّل — القرآن الكريم</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* تطبيق الثيم قبل الرسم لتجنب الوميض */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('rattil:settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (s.fontSize) document.documentElement.style.setProperty('--quran-size', s.fontSize + 'px');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="الرئيسية">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5c-4 3-9 3-12 2v16c3 1 8 1 12-2 4 3 9 3 12 2V7c-3 1-8 1-12-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 5v16" stroke="currentColor" stroke-width="2"/></svg>
      <span>رتّل</span>
    </a>
    <nav class="topnav" aria-label="التنقل الرئيسي" data-nav></nav>
    <div class="top-actions">
      <a href="#/search" class="icon-btn" aria-label="البحث" title="البحث">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </a>
      <button class="icon-btn" data-theme-toggle aria-label="الوضع الليلي" title="الوضع الليلي">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a href="#/settings" class="icon-btn" aria-label="الإعدادات" title="الإعدادات">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- مشغل التلاوة -->
  <section class="player" data-player hidden aria-label="مشغل التلاوة">
    <div class="player-progress" aria-hidden="true"><span data-p-bar></span></div>
    <div class="player-main">
      <button class="icon-btn" data-p="prev" aria-label="الآية السابقة" title="السابق"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5 9 12l9 7V5Z"/></svg></button>
      <button class="icon-btn play-btn" data-p="toggle" aria-label="تشغيل أو إيقاف مؤقت">
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5Z"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" data-p="next" aria-label="الآية التالية" title="التالي"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7V5Z"/></svg></button>
      <button class="player-info" data-p="expand" aria-expanded="false" aria-label="عرض أدوات المشغل">
        <strong data-p-title></strong>
        <span data-p-sub></span>
      </button>
      <button class="icon-btn" data-p="close" aria-label="إغلاق المشغل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="player-more" data-p-more hidden>
      <div class="seek-row">
        <span data-p-cur>٠:٠٠</span>
        <input type="range" min="0" max="1000" value="0" data-p-seek aria-label="شريط التقدم">
        <span data-p-dur>٠:٠٠</span>
      </div>
      <div class="player-tools">
        <button class="chip-btn" data-p="repeatAyah" aria-pressed="false">🔁 تكرار الآية</button>
        <button class="chip-btn" data-p="repeatSurah" aria-pressed="false">🔂 تكرار السورة</button>
        <label class="vol"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          <input type="range" min="0" max="1" step="0.05" data-p-vol aria-label="مستوى الصوت"></label>
      </div>
      <div class="player-tools">
        <a class="chip-btn" href="#/reciters" data-p-reciter>🎙️ تغيير القارئ</a>
        <a class="chip-btn" data-p-dl target="_blank" rel="noopener" download hidden>⬇️ تحميل السورة</a>
        <span class="muted small" data-p-src></span>
      </div>
    </div>
  </section>

  <nav class="tabbar" aria-label="التنقل السفلي" data-tabbar></nav>

  <div class="sheet-backdrop" data-sheet-backdrop hidden></div>
  <div class="sheet" data-sheet role="dialog" aria-modal="true" hidden></div>
  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <!-- نص القرآن من مصدر موثوق (انظر README) -->
  <script src="data/quran-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quran.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reciters/everyayah.js"></script>
  <script src="js/reciters/catalog.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/recite-engine.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/player-ui.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/reader.js"></script>
  <script src="js/views/lists.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/favorites.js"></script>
  <script src="js/views/memorize.js"></script>
  <script src="js/views/khatma.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/reciters.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/test.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
